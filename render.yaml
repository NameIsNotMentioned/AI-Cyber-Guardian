services:
  - type: web
    name: ai-cyber-guardian-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python fetch_training_data.py && python model.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: false
    autoDeploy: true
